# ============================================================
# Brighter Super — Purview Landing Zone
# Validate Pipeline (Terraform)
# Runs on every PR targeting main — init, validate, plan
# ============================================================

trigger: none

pr:
  branches:
    include:
      - main
  paths:
    include:
      - infra/**

pool:
  vmImage: 'ubuntu-latest'

variables:
  serviceConnectionName: 'sc-bsup-purview-prod'
  tfWorkingDir: '$(System.DefaultWorkingDirectory)/infra'
  # ARM_ vars are picked up automatically by the AzureRM provider
  ARM_USE_OIDC: true

stages:
  - stage: Validate
    displayName: 'Terraform Validate'
    jobs:
      - job: Validate
        displayName: 'terraform fmt + validate'
        steps:
          - checkout: self

          - task: AzureCLI@2
            displayName: 'terraform init'
            inputs:
              azureSubscription: $(serviceConnectionName)
              scriptType: bash
              scriptLocation: inlineScript
              addSpnToEnvironment: true
              inlineScript: |
                export ARM_CLIENT_ID=$servicePrincipalId
                export ARM_OIDC_TOKEN=$idToken
                export ARM_TENANT_ID=$tenantId
                export ARM_SUBSCRIPTION_ID=$(az account show --query id -o tsv)
                export ARM_USE_OIDC=true

                cd $(tfWorkingDir)
                terraform init -backend=false

          - task: AzureCLI@2
            displayName: 'terraform fmt check'
            inputs:
              azureSubscription: $(serviceConnectionName)
              scriptType: bash
              scriptLocation: inlineScript
              inlineScript: |
                cd $(tfWorkingDir)
                terraform fmt -check -recursive

          - task: AzureCLI@2
            displayName: 'terraform validate'
            inputs:
              azureSubscription: $(serviceConnectionName)
              scriptType: bash
              scriptLocation: inlineScript
              addSpnToEnvironment: true
              inlineScript: |
                export ARM_CLIENT_ID=$servicePrincipalId
                export ARM_OIDC_TOKEN=$idToken
                export ARM_TENANT_ID=$tenantId
                export ARM_SUBSCRIPTION_ID=$(az account show --query id -o tsv)
                export ARM_USE_OIDC=true

                cd $(tfWorkingDir)
                terraform init -backend=false
                terraform validate

  - stage: Plan
    displayName: 'Terraform Plan'
    dependsOn: Validate
    jobs:
      - job: Plan
        displayName: 'terraform plan'
        steps:
          - checkout: self

          - task: AzureCLI@2
            displayName: 'terraform init + plan'
            inputs:
              azureSubscription: $(serviceConnectionName)
              scriptType: bash
              scriptLocation: inlineScript
              addSpnToEnvironment: true
              inlineScript: |
                export ARM_CLIENT_ID=$servicePrincipalId
                export ARM_OIDC_TOKEN=$idToken
                export ARM_TENANT_ID=$tenantId
                export ARM_SUBSCRIPTION_ID=$(az account show --query id -o tsv)
                export ARM_USE_OIDC=true

                cd $(tfWorkingDir)

                # Install Terraform if not present
                if ! command -v terraform &> /dev/null; then
                  curl -fsSL https://releases.hashicorp.com/terraform/1.9.0/terraform_1.9.0_linux_amd64.zip -o tf.zip
                  unzip tf.zip && sudo mv terraform /usr/local/bin/
                fi

                terraform init
                terraform plan -out=tfplan 2>&1 | tee plan-output.txt

          - task: PublishPipelineArtifact@1
            displayName: 'Publish plan output'
            inputs:
              targetPath: '$(tfWorkingDir)/plan-output.txt'
              artifact: 'terraform-plan-pr'
              publishLocation: 'pipeline'


trigger: none

pr:
  branches:
    include:
      - main
  paths:
    include:
      - infra/**

pool:
  vmImage: 'ubuntu-latest'

variables:
  # Azure service connection configured in Azure DevOps project settings
  serviceConnectionName: 'sc-bsup-purview-prod'
  location: 'australiaeast'
  deploymentName: 'validate-purview-$(Build.BuildId)'

stages:
  - stage: Lint
    displayName: 'Bicep Lint'
    jobs:
      - job: Lint
        displayName: 'az bicep lint'
        steps:
          - checkout: self

          - task: AzureCLI@2
            displayName: 'Install Bicep CLI'
            inputs:
              azureSubscription: $(serviceConnectionName)
              scriptType: bash
              scriptLocation: inlineScript
              inlineScript: |
                az bicep install
                az bicep version

          - task: AzureCLI@2
            displayName: 'Lint main.bicep'
            inputs:
              azureSubscription: $(serviceConnectionName)
              scriptType: bash
              scriptLocation: inlineScript
              inlineScript: |
                az bicep lint --file infra/main.bicep

  - stage: Validate
    displayName: 'ARM Preflight Validation'
    dependsOn: Lint
    jobs:
      - job: Validate
        displayName: 'az deployment sub validate'
        steps:
          - checkout: self

          - task: AzureCLI@2
            displayName: 'Validate deployment (subscription scope)'
            inputs:
              azureSubscription: $(serviceConnectionName)
              scriptType: bash
              scriptLocation: inlineScript
              inlineScript: |
                az deployment sub validate \
                  --location $(location) \
                  --name $(deploymentName) \
                  --template-file infra/main.bicep \
                  --parameters infra/main.bicepparam

  - stage: WhatIf
    displayName: 'What-If Preview'
    dependsOn: Validate
    jobs:
      - job: WhatIf
        displayName: 'az deployment sub what-if'
        steps:
          - checkout: self

          - task: AzureCLI@2
            displayName: 'Run what-if (preview changes)'
            inputs:
              azureSubscription: $(serviceConnectionName)
              scriptType: bash
              scriptLocation: inlineScript
              inlineScript: |
                az deployment sub what-if \
                  --location $(location) \
                  --name $(deploymentName) \
                  --template-file infra/main.bicep \
                  --parameters infra/main.bicepparam \
                  --result-format FullResourcePayloads
